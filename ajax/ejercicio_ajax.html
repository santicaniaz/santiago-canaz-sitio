<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="es" lang="es">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>Ejercicio de AJAX - Santiago Cañaz</title>
  <meta name="description" content="Ejercicio de AJAX de la materia Arquitectura Web: muestra el contenido, los estados, el código y las cabeceras HTTP de una petición." />
  <meta name="author" content="Santiago Cañaz" />
  <link rel="start" href="../index.html" title="Inicio del sitio" />
  <link rel="stylesheet" type="text/css" href="ajax.css" />
</head>

<body>

  <p id="volver"><a href="../index.html">Volver al sitio de Santiago Cañaz</a></p>

  <h1>Ejercicio de AJAX</h1>

  <noscript>
    <p class="aviso">Este ejercicio necesita JavaScript para hacer la petición AJAX. Si lo tenés desactivado, activalo en tu navegador para poder probarlo.</p>
  </noscript>

  <form action="#">
    <p>
      <label for="recurso">URL del archivo a pedir:</label>
      <input type="text" id="recurso" name="recurso" size="70" value="" />
      <input type="submit" id="enviar" value="Mostrar contenidos" />
    </p>
  </form>

  <div id="principal">
    <h2>Contenidos del archivo:</h2>
    <div id="contenidos"></div>

    <h2>Cabeceras HTTP de la respuesta del servidor:</h2>
    <div id="cabeceras"></div>
  </div>

  <div id="secundario">
    <h2>Estados de la petición:</h2>
    <div id="estados"></div>

    <h2>Código de estado:</h2>
    <div id="codigo"></div>
  </div>

  <script type="text/javascript">
  //<![CDATA[
    // Crea el objeto XMLHttpRequest (con ActiveX para IE viejo)
    function crearXHR() {
      var xhrObj = null;

      if (window.XMLHttpRequest) {
        xhrObj = new XMLHttpRequest();
      } else if (window.ActiveXObject) {
        try {
          xhrObj = new ActiveXObject("Msxml2.XMLHTTP");
        } catch (error) {
          try {
            xhrObj = new ActiveXObject("Microsoft.XMLHTTP");
          } catch (error2) {
            xhrObj = null;
          }
        }
      }

      return xhrObj;
    }

    // Texto para cada valor de readyState
    var textoEstados = {
      0: "0 - UNSENT (petición no inicializada)",
      1: "1 - OPENED (conexión establecida con el servidor)",
      2: "2 - HEADERS_RECEIVED (cabeceras de la respuesta recibidas)",
      3: "3 - LOADING (descargando la respuesta)",
      4: "4 - DONE (petición finalizada)"
    };

    var xhr = null;

    function limpiarCampos() {
      document.getElementById("contenidos").innerHTML = "";
      document.getElementById("estados").innerHTML = "";
      document.getElementById("cabeceras").innerHTML = "";
      document.getElementById("codigo").innerHTML = "";
    }

    // Para que la respuesta se vea como texto y no se interprete como HTML
    function escaparHtml(texto) {
      var contenedorTemporal = document.createElement("div");
      contenedorTemporal.appendChild(document.createTextNode(texto));
      return contenedorTemporal.innerHTML;
    }

    function mostrarEstadoPeticion() {
      var estadoActual = textoEstados[xhr.readyState];
      if (estadoActual === undefined) {
        estadoActual = String(xhr.readyState);
      }

      // Voy agregando cada estado, sin borrar los anteriores
      document.getElementById("estados").innerHTML += estadoActual + "\n";

      if (xhr.readyState === 4) {
        if (xhr.status === 0) {
          // No hubo respuesta (servidor caído, URL mal escrita, etc.)
          document.getElementById("contenidos").innerHTML = "No se pudo contactar al servidor. Revisá la URL.";
          document.getElementById("codigo").innerHTML = "Sin respuesta del servidor";
        } else {
          // Muestro todo para cualquier respuesta (200, 404, 500...)
          document.getElementById("contenidos").innerHTML = escaparHtml(xhr.responseText);
          document.getElementById("cabeceras").innerHTML = escaparHtml(xhr.getAllResponseHeaders());
          document.getElementById("codigo").innerHTML = xhr.status + " " + xhr.statusText;
        }
      }
    }

    function pedirRecurso() {
      var url = document.getElementById("recurso").value;

      if (!url) {
        document.getElementById("contenidos").innerHTML = "Ingresá una URL antes de continuar.";
        return;
      }

      limpiarCampos();

      xhr = crearXHR();

      if (!xhr) {
        document.getElementById("contenidos").innerHTML = "Tu navegador no soporta AJAX (XMLHttpRequest).";
        return;
      }

      // Parámetro con la hora para que el navegador no use la caché
      var urlSinCache = url + (url.indexOf("?") === -1 ? "?" : "&") + "_=" + new Date().getTime();

      xhr.onreadystatechange = mostrarEstadoPeticion;

      try {
        xhr.open("GET", urlSinCache, true);
        xhr.send(null);
      } catch (error) {
        document.getElementById("contenidos").innerHTML = "Error al realizar la petición: " + error.message;
      }
    }

    // Cargo la URL de la propia página para probar más rápido
    window.onload = function () {
      document.getElementById("recurso").value = window.location.href;
    };

    // El botón es de tipo submit, así funciona con el mouse, con Enter o con el teclado
    document.getElementsByTagName("form")[0].onsubmit = function () {
      pedirRecurso();
      return false;
    };
  //]]>
  </script>

</body>
</html>
